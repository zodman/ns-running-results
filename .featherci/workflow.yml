name: NS Running Results CI/CD

on:
  push:
    branches:
      - main

steps:
  - name: build-frontend
    image: node:22-alpine
    commands:
      - npm ci
      - npm run build

  - name: build-image
    image: docker:27-cli
    docker: true
    depends_on:
      - build-frontend
    commands:
      - |
        set -e
        docker build -t ns-running-results:latest .
        docker save ns-running-results:latest | gzip > ns-running-results-image.tar.gz
        ls -lh ns-running-results-image.tar.gz
        docker rmi ns-running-results:latest || true

  - name: publish-opensrc-mx
    image: alpine:3.21
    depends_on:
      - build-image
    commands:
      - |
        set -e
        apk add --no-cache openssh-client

        DEPLOY_HOST="${DEPLOY_HOST}"
        DEPLOY_USER="${DEPLOY_USER}"
        DEPLOY_PORT="${DEPLOY_PORT}"
        DEPLOY_PATH="${DEPLOY_PATH}"
        ARTIFACT="ns-running-results-image.tar.gz"

        if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
          echo "ERROR: DEPLOY_SSH_KEY secret is not set in FeatherCI."
          exit 1
        fi

        mkdir -p ~/.ssh
        if printf "%s" "$DEPLOY_SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
          HEADER=$(printf "%s" "$DEPLOY_SSH_KEY" | grep -oE -- '-----BEGIN [A-Z0-9 ]+PRIVATE KEY-----' | head -n1)
          FOOTER=$(printf "%s" "$DEPLOY_SSH_KEY" | grep -oE -- '-----END [A-Z0-9 ]+PRIVATE KEY-----' | head -n1)
          BODY=$(printf "%s" "$DEPLOY_SSH_KEY" | sed "s|${HEADER}||; s|${FOOTER}||" | tr -d ' \t\r\n')
          {
            printf "%s\n" "$HEADER"
            printf "%s" "$BODY" | fold -w 70
            printf "\n%s\n" "$FOOTER"
          } > ~/.ssh/id_deploy
        else
          printf "%s" "$DEPLOY_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/id_deploy
        fi
        chmod 600 ~/.ssh/id_deploy
        printf "Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n  ConnectTimeout 15\n  StrictHostKeyChecking no\n" \
          "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config
        chmod 600 ~/.ssh/config

        # Upload pre-built Docker image artifact, then remove the local copy
        ssh deploy "mkdir -p '${DEPLOY_PATH}'"
        scp "$ARTIFACT" "deploy:${DEPLOY_PATH}/${ARTIFACT}"
        rm -f "$ARTIFACT"

        # Load the Docker image, restart the container, and clean up old files on opensrc.mx
        ssh deploy "
          set -e
          cd '${DEPLOY_PATH}'

          # 1. Unzip and load the pre-built Docker image into Docker
          gunzip -c '${ARTIFACT}' | docker load

          # 2. Delete the uploaded .tar.gz artifact to save disk space
          rm -f '${ARTIFACT}'

          # 3. Stop and remove the previous container (ignore error if first deploy)
          docker rm -f ns-running-results || true

          # 4. Start the new PocketBase + React container on 127.0.0.1:8092
          docker run -d \
            --name ns-running-results \
            --restart unless-stopped \
            --network host \
            -v ns_running_pb_data:/app/pb_data \
            -e TZ=America/Halifax \
            ns-running-results:latest \
            /usr/local/bin/pocketbase serve \
              --http=127.0.0.1:8092 \
              --dir=/app/pb_data \
              --publicDir=/app/pb_public \
              --migrationsDir=/app/pb_migrations \
              --hooksDir=/app/pb_hooks

          # 5. Remove old unused Docker image layers to save disk space
          docker image prune -f
        "

        echo "Deployed pre-built Docker image to opensrc.mx:8092 and deleted artifact on both sides."

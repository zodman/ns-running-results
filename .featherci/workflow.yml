name: NS Running Results CI/CD

on:
  push:
    branches:
      - main

steps:
  - name: build
    image: node:22-alpine
    commands:
      - npm ci
      - npm run build

  - name: publish-opensrc-mx
    image: alpine:3.21
    depends_on:
      - build
    commands:
      - |
        set -e
        apk add --no-cache openssh-client rsync

        DEPLOY_HOST="${DEPLOY_HOST}"
        DEPLOY_USER="${DEPLOY_USER}"
        DEPLOY_PORT="${DEPLOY_PORT}"
        DEPLOY_PATH="${DEPLOY_PATH}"

        if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
          echo "ERROR: DEPLOY_SSH_KEY secret is not set in FeatherCI."
          exit 1
        fi

        mkdir -p ~/.ssh
        if printf "%s" "$DEPLOY_SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
          HEADER=$(printf "%s" "$DEPLOY_SSH_KEY" | grep -oE -- '-----BEGIN [A-Z0-9 ]+PRIVATE KEY-----' | head -n1)
          FOOTER=$(printf "%s" "$DEPLOY_SSH_KEY" | grep -oE -- '-----END [A-Z0-9 ]+PRIVATE KEY-----' | head -n1)
          BODY=$(printf "%s" "$DEPLOY_SSH_KEY" | sed "s|${HEADER}||; s|${FOOTER}||" | tr -d ' \t\r\n')
          {
            printf "%s\n" "$HEADER"
            printf "%s" "$BODY" | fold -w 70
            printf "\n%s\n" "$FOOTER"
          } > ~/.ssh/id_deploy
        else
          printf "%s" "$DEPLOY_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/id_deploy
        fi
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        SSH_CMD="ssh -i ~/.ssh/id_deploy -p $DEPLOY_PORT -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no"

        $SSH_CMD "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}"

        rsync -az --delete \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='dist' \
          --exclude='pocketbase/pb_data' \
          --exclude='pocketbase/pocketbase.exe' \
          --exclude='data/route541_2026' \
          -e "$SSH_CMD" \
          ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

        $SSH_CMD "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_PATH} && docker build -t ns-running-results . && (docker rm -f ns-running-results || true) && docker run -d --name ns-running-results --restart unless-stopped -p 127.0.0.1:8092:8090 -v ns_running_pb_data:/app/pb_data -e TZ=America/Halifax ns-running-results"

        echo "Deployed successfully to https://ns-running-results.opensrc.mx"

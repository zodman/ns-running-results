name: NS Running Results CI/CD

on:
  push:
    branches:
      - main

steps:
  - name: build-frontend
    image: node:22-alpine
    commands:
      - npm ci
      - npm run build

  - name: build-image
    image: docker:27-cli
    docker: true
    depends_on:
      - build-frontend
    commands:
      - |
        set -e
        docker build -t ns-running-results:latest .
        docker save ns-running-results:latest | gzip > ns-running-results-image.tar.gz
        ls -lh ns-running-results-image.tar.gz
        docker rmi ns-running-results:latest || true

  - name: publish-opensrc-mx
    image: alpine:3.21
    depends_on:
      - build-image
    commands:
      - |
        set -e
        apk add --no-cache openssh-client

        DEPLOY_HOST="${DEPLOY_HOST}"
        DEPLOY_USER="${DEPLOY_USER}"
        DEPLOY_PORT="${DEPLOY_PORT}"
        DEPLOY_PATH="${DEPLOY_PATH}"
        ARTIFACT="ns-running-results-image.tar.gz"

        if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
          echo "ERROR: DEPLOY_SSH_KEY secret is not set in FeatherCI."
          exit 1
        fi

        mkdir -p ~/.ssh
        if printf "%s" "$DEPLOY_SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
          HEADER=$(printf "%s" "$DEPLOY_SSH_KEY" | grep -oE -- '-----BEGIN [A-Z0-9 ]+PRIVATE KEY-----' | head -n1)
          FOOTER=$(printf "%s" "$DEPLOY_SSH_KEY" | grep -oE -- '-----END [A-Z0-9 ]+PRIVATE KEY-----' | head -n1)
          BODY=$(printf "%s" "$DEPLOY_SSH_KEY" | sed "s|${HEADER}||; s|${FOOTER}||" | tr -d ' \t\r\n')
          {
            printf "%s\n" "$HEADER"
            printf "%s" "$BODY" | fold -w 70
            printf "\n%s\n" "$FOOTER"
          } > ~/.ssh/id_deploy
        else
          printf "%s" "$DEPLOY_SSH_KEY" | tr -d ' \t\r\n' | base64 -d > ~/.ssh/id_deploy
        fi
        chmod 600 ~/.ssh/id_deploy
        ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

        SSH_OPTS="-i ~/.ssh/id_deploy -p $DEPLOY_PORT -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no"
        SCP_OPTS="-i ~/.ssh/id_deploy -P $DEPLOY_PORT -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no"

        # Upload pre-built Docker image artifact, delete locally, load & run on opensrc.mx, delete remotely
        ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_PATH}"
        scp $SCP_OPTS "$ARTIFACT" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/${ARTIFACT}"
        rm -f "$ARTIFACT"

        ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "set -e && cd ${DEPLOY_PATH} && gunzip -c ${ARTIFACT} | docker load && rm -f ${ARTIFACT} && (docker rm -f ns-running-results || true) && docker run -d --name ns-running-results --restart unless-stopped -p 127.0.0.1:8092:8090 -v ns_running_pb_data:/app/pb_data -e TZ=America/Halifax ns-running-results:latest && docker image prune -f"

        echo "Deployed pre-built Docker image to opensrc.mx:8092 and deleted artifact on both sides."

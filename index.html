<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <meta

      content="Track official Nova Scotia road &amp; trail race results from Atlantic Chip &amp; Route541, collect 32 iconic finisher medals, capture all 7 NS regions, and unlock achievement trophies."
    />

    <!-- Open Graph / Facebook / WhatsApp / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NS Running Results" />
    <meta property="og:url" content="https://ns-running-results.opensrc.mx/" />
    <meta property="og:title" content="Nova Scotia Race Passport &amp; Running Results" />
    <meta
      property="og:description"
      content="Collect 32 iconic Nova Scotia finisher medals, capture all 7 running regions, and track your official Atlantic Chip &amp; Route541 race history."
    />

    <meta
      property="og:image:secure_url"
      content="https://ns-running-results.opensrc.mx/og-passport.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />

      property="og:image:alt"
      content="Nova Scotia Race Passport — 32 Iconic Finisher Medals, 7 Regions &amp; Achievement Trophies"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova Scotia Race Passport &amp; Running Results" />
    <meta
      name="twitter:description"
      content="Collect 32 iconic Nova Scotia finisher medals, capture all 7 running regions, and track official Atlantic Chip &amp; Route541 results."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TPBC8L8V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Track all click events globally
      document.addEventListener('click', function(e) {
        try {
          var el = e.target;
          if (!el) return;
          var interactive = el.closest ? el.closest('button, a, input, select, textarea, [role="button"], article, .card, .region-card, .passport-medal-card, .trophy-card') : null;
          var node = interactive || el;
          var rawText = (node.innerText || node.getAttribute('aria-label') || node.getAttribute('title') || node.getAttribute('alt') || node.value || '').trim();
          var cleanText = rawText.replace(/\s+/g, ' ').slice(0, 120);
          window.dataLayer.push({
            event: 'click',
            event_category: 'interaction',
            event_label: cleanText || node.tagName.toLowerCase(),
            click_element: node.tagName.toLowerCase(),
            click_id: node.id || undefined,
            click_classes: typeof node.className === 'string' ? node.className : undefined,
            click_text: cleanText,
            click_url: (node.href && typeof node.href === 'string') ? node.href : undefined
          });
        } catch (_) {}
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
